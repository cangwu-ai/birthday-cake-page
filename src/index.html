<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="把一小片星河，送给今天的你。拾野生日蛋糕视觉致敬，愿你生日快乐。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Happy birthday! - 拾野</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #000;
      color-scheme: dark;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }

    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      z-index: 1;
      touch-action: none;
    }

    #canvas-container canvas {
      display: block;
    }

    .overlay {
      position: fixed;
      z-index: 10;
      pointer-events: none;
      user-select: none;
    }

    .birthday-text {
      bottom: calc(12% + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      opacity: 0;
      animation: fadeInUp 2s ease-out 2s forwards;
    }

    .birthday-text h1 {
      font-family: 'Snell Roundhand', 'Bradley Hand', 'Segoe Script', 'Georgia', cursive;
      font-size: clamp(2rem, 9vw, 5rem);
      font-weight: 500;
      letter-spacing: 0.02em;
      color: #fffaf0;
      text-shadow:
        0 0 20px rgba(255, 240, 200, 0.7),
        0 0 40px rgba(255, 220, 150, 0.5),
        0 0 60px rgba(255, 200, 100, 0.3),
        0 0 80px rgba(255, 180, 80, 0.2);
      white-space: nowrap;
    }

    .signature {
      position: fixed;
      bottom: calc(8% + env(safe-area-inset-bottom, 0px));
      right: max(6%, env(safe-area-inset-right, 0px));
      z-index: 10;
      pointer-events: none;
      user-select: none;
      opacity: 0;
      animation: fadeIn 1.5s ease-out 2.5s forwards;
    }

    .signature span {
      font-family: 'STKaiti', 'KaiTi', 'Kaiti SC', 'SimSun', serif;
      font-size: clamp(1.2rem, 4vw, 1.8rem);
      color: rgba(238, 233, 220, 0.75);
      letter-spacing: 0.15em;
      writing-mode: horizontal-tb;
    }

    .hint {
      bottom: calc(max(env(safe-area-inset-bottom, 0px), 1rem) + 0.5rem);
      left: 50%;
      transform: translateX(-50%);
      padding: 0.5rem 1rem;
      font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.3);
      opacity: 0;
      animation: fadeIn 1s ease-out 3.5s forwards, pulse 2.5s ease-in-out 4.5s infinite;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.5; }
    }

    .loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 1s ease-out;
    }

    .loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-text {
      font-family: 'Snell Roundhand', 'Bradley Hand', 'Segoe Script', 'Georgia', cursive;
      font-size: 1.5rem;
      color: rgba(255, 250, 243, 0.5);
      letter-spacing: 0.15em;
      animation: loadingPulse 1.5s ease-in-out infinite;
    }

    @keyframes loadingPulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.7; }
    }

    @media (prefers-reduced-motion: reduce) {
      .birthday-text, .signature, .hint {
        animation: none;
        opacity: 1;
      }
      .birthday-text {
        transform: translateX(-50%);
      }
    }

    @media (max-width: 480px) {
      .birthday-text {
        bottom: calc(14% + env(safe-area-inset-bottom, 0px));
      }

      .birthday-text h1 {
        font-size: clamp(1.8rem, 8vw, 3rem);
      }

      .signature {
        bottom: calc(9% + env(safe-area-inset-bottom, 0px));
        right: 5%;
      }
    }

    @media (max-height: 600px) {
      .birthday-text {
        bottom: calc(6% + env(safe-area-inset-bottom, 0px));
      }

      .birthday-text h1 {
        font-size: clamp(1.5rem, 7vw, 2.5rem);
      }

      .signature {
        bottom: calc(4% + env(safe-area-inset-bottom, 0px));
      }
    }

    @media (orientation: landscape) and (max-height: 500px) {
      .birthday-text {
        bottom: calc(4% + env(safe-area-inset-bottom, 0px));
      }

      .birthday-text h1 {
        font-size: clamp(1.2rem, 5vh, 2rem);
      }

      .signature {
        bottom: calc(3% + env(safe-area-inset-bottom, 0px));
        font-size: 1rem;
      }

      .hint {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading">
    <span class="loading-text">Loading...</span>
  </div>

  <div id="canvas-container"></div>

  <div class="overlay birthday-text">
    <h1>Happy birthday!</h1>
  </div>

  <div class="signature">
    <span>拾野</span>
  </div>

  <div class="overlay hint">
    拖拽旋转 · 点击烛火
  </div>

  <script type="module" src="./main.js"></script>
  <script>
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('loading').classList.add('hidden');
      }, 600);
    });
  </script>
</body>
</html>
