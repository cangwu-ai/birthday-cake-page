<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="把一小片星河，送给今天的你。拾野生日蛋糕视觉致敬，愿你生日快乐。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Happy birthday! - 拾野</title>
  <link rel="icon" href="./assets/favicon-DkAG1F8P.svg" type="image/svg+xml">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color-scheme: dark;
      touch-action: none;
    }

    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #canvas-container canvas {
      display: block;
    }

    .overlay {
      position: fixed;
      z-index: 10;
      pointer-events: none;
      user-select: none;
    }

    .title {
      top: 0;
      left: 0;
      right: 0;
      padding: max(env(safe-area-inset-top), 2rem) 1.5rem 1.5rem;
      text-align: center;
      opacity: 0;
      animation: fadeIn 2s ease-out 2.5s forwards;
    }

    .title h1 {
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: clamp(2rem, 8vw, 4rem);
      font-weight: 400;
      letter-spacing: 0.1em;
      color: #fffaf3;
      text-shadow: 0 0 30px rgba(255, 230, 180, 0.5),
                   0 0 60px rgba(255, 200, 100, 0.3);
      margin-bottom: 0.5rem;
    }

    .title .signature {
      font-family: 'STKaiti', 'KaiTi', 'Kaiti SC', serif;
      font-size: clamp(1.2rem, 4vw, 1.8rem);
      color: #eee9e1;
      letter-spacing: 0.3em;
      opacity: 0.8;
    }

    .message {
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1.5rem 1.5rem max(env(safe-area-inset-bottom), 2rem);
      text-align: center;
      opacity: 0;
      animation: fadeIn 2s ease-out 3s forwards;
    }

    .message p {
      font-family: 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif;
      font-size: clamp(0.9rem, 3vw, 1.2rem);
      color: rgba(255, 250, 243, 0.8);
      letter-spacing: 0.15em;
      line-height: 1.8;
    }

    .hint {
      bottom: max(env(safe-area-inset-bottom), 1rem);
      left: 50%;
      transform: translateX(-50%);
      padding: 0.5rem 1rem;
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.4);
      opacity: 0;
      animation: fadeIn 1s ease-out 4s forwards, pulse 2s ease-in-out 5s infinite;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.7; }
    }

    .loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 1s ease-out;
    }

    .loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-text {
      font-family: 'Georgia', serif;
      font-size: 1.2rem;
      color: rgba(255, 250, 243, 0.6);
      letter-spacing: 0.2em;
      animation: loadingPulse 1.5s ease-in-out infinite;
    }

    @keyframes loadingPulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.8; }
    }

    @media (prefers-reduced-motion: reduce) {
      .title, .message, .hint {
        animation: none;
        opacity: 1;
      }
    }

    @media (max-width: 480px) {
      .title {
        padding-top: max(env(safe-area-inset-top), 1.5rem);
      }

      .message {
        padding-bottom: max(env(safe-area-inset-bottom), 4rem);
      }
    }
  </style>
  <script type="module" crossorigin src="./assets/index-B4iXz68G.js"></script>
</head>
<body>
  <div id="loading" class="loading">
    <span class="loading-text">Loading...</span>
  </div>

  <div id="canvas-container"></div>

  <div class="overlay title">
    <h1>Happy birthday!</h1>
    <div class="signature">拾野</div>
  </div>

  <div class="overlay message">
    <p>一小片星河，送给今天的你</p>
  </div>

  <div class="overlay hint">
    拖拽旋转 / 点击烛火
  </div>

  <script>
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('loading').classList.add('hidden');
      }, 500);
    });
  </script>
</body>
</html>
