<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="把一小片星河，送给今天的你。拾野生日蛋糕视觉致敬，愿你生日快乐。">
  <title>Happy birthday! · 拾野</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script src="./cake.js" defer></script>
</head>
<body>
  <main class="birthday" aria-label="生日快乐">
    <figure class="scene">
      <svg class="cake-art" viewBox="55 0 490 720" role="img" aria-labelledby="cake-title cake-description">
        <title id="cake-title">一小片星河，送给今天的你</title>
        <desc id="cake-description">黑色夜幕中，一根细蜡烛在单层深蓝星空蛋糕上燃烧，黄白色火焰轻轻明灭。青、粉、黄、红、白星点与纸屑在玻璃穹顶里漂浮。蛋糕有彩色霓虹流挂，放在带蓝色底影的白色椭圆盘上。Happy birthday! 拾野。</desc>
        <defs>
          <linearGradient id="body" x1="0" y1="0" x2="1" y2=".15">
            <stop stop-color="#122d69"/><stop offset=".13" stop-color="#07162d"/>
            <stop offset=".5" stop-color="#060c19"/><stop offset=".83" stop-color="#091224"/><stop offset="1" stop-color="#16436f"/>
          </linearGradient>
          <radialGradient id="top"><stop stop-color="#e6cd7c"/><stop offset=".22" stop-color="#7b6c7c"/><stop offset=".52" stop-color="#243c65"/><stop offset="1" stop-color="#0a1730"/></radialGradient>
          <linearGradient id="icing" x2=".9" y2="1"><stop stop-color="#72ebef"/><stop offset=".25" stop-color="#208cf1"/><stop offset=".5" stop-color="#a58cf4"/><stop offset=".72" stop-color="#ef41b2"/><stop offset="1" stop-color="#12133f"/></linearGradient>
          <linearGradient id="cyan" x2=".4" y2="1"><stop stop-color="#74ebff"/><stop offset=".5" stop-color="#0dd6ec"/><stop offset="1" stop-color="#195fca"/></linearGradient>
          <linearGradient id="pink" x2=".3" y2="1"><stop stop-color="#ffe3ff"/><stop offset=".3" stop-color="#f34db1"/><stop offset="1" stop-color="#88278e"/></linearGradient>
          <linearGradient id="gold" x2=".4" y2="1"><stop stop-color="#fff3a3"/><stop offset=".4" stop-color="#ffe15a"/><stop offset="1" stop-color="#a66c19"/></linearGradient>
          <linearGradient id="plate" x2="0" y2="1"><stop stop-color="#b3c1e7"/><stop offset=".52" stop-color="#fffef6"/><stop offset="1" stop-color="#e7e5f6"/></linearGradient>
          <linearGradient id="plate-edge" x2="0" y2="1"><stop stop-color="#f5efff"/><stop offset=".5" stop-color="#c1cdfa"/><stop offset="1" stop-color="#3268c7"/></linearGradient>
          <radialGradient id="flame-glow"><stop stop-color="#fff6b8" stop-opacity=".8"/><stop offset=".3" stop-color="#ffcb48" stop-opacity=".35"/><stop offset="1" stop-color="#ff9c22" stop-opacity="0"/></radialGradient>
          <linearGradient id="flame" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".5" stop-color="#fffde0"/><stop offset=".8" stop-color="#fff5a4"/><stop offset="1" stop-color="#ffbe30"/></linearGradient>
          <linearGradient id="glass" x2=".9" y2="1"><stop stop-color="#789ac2" stop-opacity=".05"/><stop offset=".18" stop-color="#ffcc87" stop-opacity=".85"/><stop offset=".38" stop-color="#d6eaff" stop-opacity=".04"/><stop offset=".7" stop-color="#e3dcff" stop-opacity=".35"/><stop offset="1" stop-color="#b6cdf6" stop-opacity=".02"/></linearGradient>
          <radialGradient id="nebula"><stop stop-color="#527ff0" stop-opacity=".4"/><stop offset="1" stop-color="#24519c" stop-opacity="0"/></radialGradient>
          <filter id="soft-glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2"/></filter>
          <filter id="halo" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
          <clipPath id="body-clip"><path d="M149 339 C149 305 451 305 451 339 L451 490 C450 550 150 550 149 490Z"/></clipPath>
          <clipPath id="top-clip"><ellipse cx="300" cy="336" rx="151" ry="52"/></clipPath>
          <clipPath id="dome-clip"><path d="M99 488 C46 405 60 219 131 126 C173 70 235 46 300 46 C365 46 427 70 469 126 C540 219 554 405 501 488Z"/></clipPath>
          <path id="star" d="M0-7 2.05-2.6 6.65-2.16 3.33 1.08 4.11 5.66 0 3.5-4.11 5.66-3.33 1.08-6.65-2.16-2.05-2.6Z"/>
          <path id="spark" d="M0-6 .9-.9 6 0 .9.9 0 6-.9.9-6 0-.9-.9Z"/>
        </defs>

        <!-- The glass is deliberately a few broken reflections, not a solid bubble. -->
        <g fill="none" stroke-linecap="round">
          <path d="M98 458 C35 304 79 127 216 62 C265 39 330 40 371 59" stroke="url(#glass)" stroke-width="2.3"/>
          <path d="M404 76 C511 139 556 312 506 456" stroke="url(#glass)" stroke-width="2"/>
          <path d="M104 174 C64 246 60 344 87 418" stroke="#b6cdff" stroke-opacity=".23" stroke-width="3.3"/>
          <path d="M125 143 C171 81 230 53 278 51" stroke="#ffe4ae" stroke-opacity=".5" stroke-width="1"/>
          <path d="M467 161 C500 212 517 261 518 305" stroke="#ffdbad" stroke-opacity=".5" stroke-width="1.5"/>
          <path d="M527 327 C530 365 521 406 510 433" stroke="#e5efff" stroke-opacity=".2"/>
        </g>
        <g id="dome-stars" clip-path="url(#dome-clip)" aria-hidden="true"></g>

        <!-- White porcelain, with a thicker near rim and cool blue underside. -->
        <ellipse cx="300" cy="537" rx="191" ry="30" fill="#1945d1" opacity=".3" filter="url(#halo)"/>
        <path d="M91 499 C91 460 509 460 509 499 L509 510 C502 589 98 589 91 510Z" fill="url(#plate-edge)"/>
        <ellipse cx="300" cy="499" rx="209" ry="72" fill="url(#plate)" stroke="#fff7f0" stroke-width="2"/>
        <ellipse cx="300" cy="500" rx="197" ry="63" fill="none" stroke="#929ce0" stroke-opacity=".45" stroke-width="2"/>
        <ellipse cx="300" cy="506" rx="161" ry="45" fill="#344d9c" opacity=".4"/>
        <g id="plate-confetti" aria-hidden="true"></g>

        <!-- One short cylinder. There are no stacked cake tiers. -->
        <path d="M149 339 C149 305 451 305 451 339 L451 490 C450 550 150 550 149 490Z" fill="url(#body)"/>
        <g clip-path="url(#body-clip)">
          <ellipse cx="190" cy="469" rx="90" ry="72" fill="url(#nebula)"/>
          <ellipse cx="406" cy="407" rx="77" ry="85" fill="url(#nebula)"/>
          <path d="M151 463 C169 490 174 477 190 500 S224 492 239 509 S269 512 282 516 S330 504 343 515 S376 496 390 506 S430 475 451 477 L451 530 H149Z" fill="#3167b7" opacity=".8"/>
          <path d="M151 482 Q170 506 191 505 T236 518 T280 525 T330 520 T377 515 T421 504 L451 480" fill="none" stroke="#57cbe7" stroke-opacity=".6" stroke-width="5"/>
          <path d="M154 349 C164 355 158 407 161 448 Q165 466 172 448 L177 380 Q181 362 187 380 L190 408 Q196 420 201 405 L207 363 L215 349Z" fill="url(#cyan)"/>
          <path d="M202 355 Q211 366 215 395 Q220 415 226 395 L230 374 Q233 368 238 380 L242 397 Q249 406 252 393 L256 359Z" fill="url(#pink)"/>
          <path d="M413 348 L418 391 Q423 411 427 390 L430 365 Q433 351 436 372 L439 463 Q445 485 451 461 L453 343Z" fill="url(#cyan)"/>
          <path d="M358 368 L362 389 Q367 407 372 388 L375 369Z" fill="url(#gold)"/>
          <path d="M279 371 L284 396 Q288 404 291 395 L294 375Z" fill="url(#icing)"/>
          <g id="side-confetti" aria-hidden="true"></g>
        </g>
        <ellipse cx="300" cy="336" rx="151" ry="52" fill="url(#top)" stroke="#7d9cbb" stroke-opacity=".45" stroke-width="1.5"/>
        <path d="M149 337 C157 341 162 347 166 343 S176 349 181 345 S191 361 200 355 S215 373 226 365 S249 382 262 373 S284 388 299 379 S317 388 329 376 S353 382 366 369 S386 371 398 357 S417 361 425 348 S444 348 451 337" fill="none" stroke="url(#icing)" stroke-width="9" stroke-linecap="round"/>
        <g id="top-confetti" clip-path="url(#top-clip)" aria-hidden="true"></g>
        <ellipse cx="300" cy="328" rx="44" ry="14" fill="#ffdb55" opacity=".4" filter="url(#halo)"/>
        <g class="cake-lettering" fill="#eee9dc" text-anchor="middle">
          <text x="320" y="450" transform="rotate(-5 320 450)" font-size="13" letter-spacing=".4">happy birthday</text>
          <text x="320" y="468" transform="rotate(-5 320 468)" font-size="5.7" letter-spacing="3" opacity=".5">MAKE A WISH</text>
        </g>

        <!-- A single slim cream candle and a yellow-white teardrop flame. -->
        <ellipse cx="299" cy="326" rx="9" ry="3" fill="#ffe9a5"/>
        <path d="M294 224 Q300 221 306 224 L304 325 Q300 329 295 325Z" fill="url(#gold)"/>
        <path d="M296 226 L297 320" stroke="#fff3bb" stroke-width="2" opacity=".8"/>
        <path d="M300 225 Q298 218 301 212" fill="none" stroke="#302a26" stroke-width="2"/>
        <g class="flame-halo"><ellipse cx="300" cy="191" rx="43" ry="61" fill="url(#flame-glow)"/></g>
        <g class="flame">
          <path d="M300 132 C300 162 282 182 286 202 C289 225 313 224 315 203 C317 182 304 163 300 132Z" fill="#ffcb59" opacity=".65" filter="url(#soft-glow)"/>
          <path d="M300 135 C300 164 286 187 289 202 C292 219 309 219 311 202 C313 184 303 165 300 135Z" fill="url(#flame)"/>
          <path d="M300 173 C300 188 293 198 295 207 Q300 219 306 207 C308 199 302 188 300 173Z" fill="#fffef1"/>
        </g>
        <g id="foreground-stars" aria-hidden="true"></g>

        <g class="birthday-title" fill="#fffaf3" aria-hidden="true">
          <use href="#spark" x="139" y="627" transform="rotate(12 139 627)" opacity=".75"/>
          <use href="#spark" x="454" y="658" opacity=".65"/>
          <text x="300" y="668" text-anchor="middle">Happy birthday!</text>
          <path d="M174 681 Q286 671 417 677" fill="none" stroke="#fffaf3" stroke-width="1.4" opacity=".55"/>
        </g>
        <text class="signature" x="470" y="618" fill="#eee9e1" transform="rotate(-8 470 618)" aria-hidden="true">拾野</text>
      </svg>
      <figcaption class="sr-only">Happy birthday! 生日快乐。拾野生日蛋糕视觉致敬。</figcaption>
    </figure>
  </main>
</body>
</html>
